<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <form>
    <header>
        <h1 style="color: brown;">Welcome to KIET Deemed to be University</h1>
    <fieldset>
        <legend>Student Registration Form</legend>
        <label for="abc">Name:</label>
        <img src="https://www.kiet.edu/assets/images/kiet/campus-life/infrastructure/Infra_1.webp"
     alt="kiet image"
     width="300"
     height="200">
    </header>
    <main>
        <section>
        <input
        type="text"
        id="abc"
        name="Name"
        placeholder="Enter your name">
        </section>
        <br><br><br>

        <section>
        <label for="email">Email:</label>
        <input
        type="Email"
        id="email"
        name="Email"
        placeholder="Enter your email">
        </section>
        <br><br><br>

        <section>
        <label for="age">Age:</label>
        <input
        type="number"
        id="age"
        name="age">
        </section>
       <br><br><br>

       <section>
       <label for="dob">Date of Birth:</label>
       <input
        type="date"
        id="dob"
        name="Date of Birth">
        </section>
        <br><br><br>

        <section>
        <label>Gender:</label>
        <input type="radio" name="gender" value="male">
        Male
        <input type="radio" name="gender" value="female">
        Female
        </section>
        <br><br><br>

        <section>
        <label for="city">Choose your city:</label>
        <select id="city" name="city">
        <option value="delhi">Delhi</option>
        <option value="mumbai">Mumbai</option>
        <option value="kolkata">Kolkata</option>
        <option value="chennai">Chennai</option>
        </select>
        </section>
        <br><br><br>

        <section>
        <label for="course">Course:</label>
        <select id="course" name="Course">
        <option>BCA</option>
        <option>B.Tech</option>
        <option>MCA</option>
        <option>MBA</option>
        <option>M.Tech</option>
        </select>
        </section>
        <br><br><br>

        <section>
        <label>Skills:</label>
        <input type="checkbox" name="skill" value="html">
        HTML
        <input type="checkbox" name="skill" value="c++">
        C++
        <input type="checkbox" name="skill" value="javascript">
        JavaScript
        </section>
        <br><br><br>
        <footer>
        <label for="message">Your description:</label><br>
        <textarea id="message" name="message" rows="4"cols="40"></textarea>
    <input type="submit" value="Submit">
    </footer>
    </main>
    </fieldset>
   </form> 
</body>
</html>
